name: CI

# PR에서만 실행한다. 브랜치 보호가 main 최신 상태를 요구하므로 PR 검증 결과 = 병합 결과.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 러너 이미지와 Xcode 버전을 고정한다. 올릴 때는 이 두 값과 docs를 함께 갱신한다.
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build-test:
    name: build-test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP 이 러너 이미지에 없습니다. 사용 가능한 Xcode:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      # 엔진 다운로드와 ffmpeg 빌드 결과를 캐시한다. 스크립트가 바뀌면 키가 바뀌어 다시 받는다/빌드한다.
      - name: Cache engine
        uses: actions/cache@v4
        with:
          path: build/engine-cache
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-binaries.sh', 'scripts/build-ffmpeg.sh', 'scripts/lib/common.sh') }}

      - name: Fetch engine binaries
        run: scripts/fetch-binaries.sh

      - name: Build ffmpeg (LGPL)
        run: scripts/build-ffmpeg.sh

      - name: Test (Debug)
        run: |
          xcodebuild \
            -project Stow.xcodeproj \
            -scheme Stow \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            test

      - name: Build (Release)
        run: |
          xcodebuild \
            -project Stow.xcodeproj \
            -scheme Stow \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            build

      - name: Verify Release binary
        run: |
          APP=build/DerivedData/Build/Products/Release/Stow.app
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Stow")
          echo "archs: $ARCHS"
          [ "$ARCHS" = "arm64" ] || { echo "::error::arm64 전용이 아님: $ARCHS"; exit 1; }
          FLAGS=$(codesign -dv "$APP" 2>&1 | grep flags=)
          echo "$FLAGS"
          echo "$FLAGS" | grep -q runtime || { echo "::error::Hardened Runtime 미적용"; exit 1; }
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q app-sandbox; then
            echo "::error::샌드박스 엔타이틀먼트가 포함됨"; exit 1
          fi
          echo "LSMinimumSystemVersion: $(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")"

      - name: Verify bundled engine
        run: |
          APP=build/DerivedData/Build/Products/Release/Stow.app
          BIN="$APP/Contents/Resources/bin"
          codesign --verify --deep --strict "$APP" || { echo "::error::앱 서명 검증 실패"; exit 1; }
          for f in python/bin/python3.13 deno ffmpeg ffprobe; do
            FLAGS=$(codesign -dv "$BIN/$f" 2>&1 | grep flags=)
            echo "$f: $FLAGS"
            echo "$FLAGS" | grep -q runtime || { echo "::error::$f 에 Hardened Runtime 미적용"; exit 1; }
          done
          echo "yt-dlp: $("$BIN/python/bin/python3" -I -B "$BIN/yt-dlp" --version)"
          echo "deno: $("$BIN/deno" eval 'console.log(Deno.version.deno)')"
          "$BIN/ffmpeg" -version | head -1
          CONF=$("$BIN/ffmpeg" -hide_banner -buildconf)
          if grep -qE -- '--enable-(gpl|nonfree|version3)' <<<"$CONF"; then
            echo "::error::ffmpeg 구성에 GPL/nonfree/version3 포함"; exit 1
          fi
