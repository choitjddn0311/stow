name: Windows

# Windows 버전(windows/)이 바뀐 PR에서만 실행한다. 공통 로직 테스트 → x64·ARM64 앱 빌드 → 실행 파일을 아티팩트로 올린다
# (Windows PC에서 받아 실행해 보는 용도).
on:
  pull_request:
    branches: [main]
    paths:
      - windows/**
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            artifact: Stow-windows-x64
          - rid: win-arm64
            platform: ARM64
            artifact: Stow-windows-arm64
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      # 공통 로직 테스트는 플랫폼과 무관하므로 x64에서 한 번만 돌린다.
      - name: Test core
        if: matrix.rid == 'win-x64'
        run: dotnet test --project tests/Stow.Core.Tests -c Release

      - name: Publish app (${{ matrix.rid }})
        run: |
          dotnet publish src/Stow.App/Stow.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --self-contained -o out/${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 실행 파일과 화면 리소스(resources.pri)가 있어야 앱이 뜬다.
          foreach ($file in @('Stow.exe', 'resources.pri')) {
            if (-not (Test-Path "out/${{ matrix.rid }}/$file")) { Write-Error "out/${{ matrix.rid }}/$file 없음"; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: windows/out/${{ matrix.rid }}
          retention-days: 14
