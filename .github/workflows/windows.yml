name: Windows

# Windows 버전(windows/)이 바뀐 PR에서만 실행한다. 공통 로직 테스트 → x64·ARM64 앱 빌드 → 실행 파일을 아티팩트로 올린다
# (Windows PC에서 받아 실행해 보는 용도).
on:
  pull_request:
    branches: [main]
    paths:
      - windows/**
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Test core
        run: dotnet test --project tests/Stow.Core.Tests -c Release

      - name: Publish app (x64, ARM64)
        run: |
          foreach ($arch in @(@{ Rid = 'win-x64'; Platform = 'x64' }, @{ Rid = 'win-arm64'; Platform = 'ARM64' })) {
            dotnet publish src/Stow.App/Stow.App.csproj -c Release -r $arch.Rid -p:Platform=$($arch.Platform) --self-contained -o "out/$($arch.Rid)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path "out/$($arch.Rid)/Stow.exe")) { Write-Error "out/$($arch.Rid)/Stow.exe 없음"; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Stow-windows-x64
          path: windows/out/win-x64
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Stow-windows-arm64
          path: windows/out/win-arm64
          retention-days: 14
